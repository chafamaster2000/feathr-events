[project]
name = "feathr-events"
version = "0.1.0"
description = "Distributed Event Processing Platform - Feathr take-home"
# Bounded above on purpose: the Dockerfile runs 3.13-slim, and without the ceiling uv
# resolves to the system's 3.14. Tests passing on a different interpreter from the one in
# production is a silent trap. See .python-version.
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    # Driver Mongo async NATIVO. NO usar motor: deprecado el 2026-05-14.
    "pymongo==4.17.0",
    "redis==8.1.0",
    # El major DEBE coincidir con el del servidor ES (9.x).
    # El extra [async] trae aiohttp: sin el, AsyncElasticsearch tira
    # "You must have 'aiohttp' installed to use AiohttpHttpNode" al arrancar.
    "elasticsearch[async]==9.5.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov>=7.0",
    "httpx==0.28.1",
    "ruff==0.16.4",
]

# No [build-system] on purpose: this is an application, not a library. uv treats it as a
# virtual project and does not try to build a wheel.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The repo root on sys.path: `app` is a package of this project, not an installed
# library (tool.uv.package = false, so no wheel puts it there).
pythonpath = ["."]
markers = [
    "integration: runs against the real docker compose stack (make up). Skipped when it is not up.",
]
